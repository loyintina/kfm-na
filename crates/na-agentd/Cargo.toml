[package]
name = "na-agentd"
version = "0.1.0"
edition = "2024"
description = "na agent 服务器薄壳（工单④ BAR-161）：127.0.0.1:9041 本地 HTTP daemon（systemd 常驻）+ na-agent CLI；核心全在 na-agent 库，本 crate 只是装配工"

[[bin]]
name = "na-agentd"
path = "src/main.rs"

[[bin]]
name = "na-agent"
path = "src/bin/na-agent.rs"

[dependencies]
na-agent = { path = "../na-agent" }
# 信件名 v2.1 中文句法文法判卷复用纯函数核（BAR-172；零平台依赖，不违分层纪律——
# 零依赖约束只管 cordis-na 核心层）
mailbox-core = { path = "../mailbox-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
