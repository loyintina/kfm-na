[package]
name = "na-quic"
version = "0.1.0"
edition = "2024"
description = "na QUIC 隧道：quinn endpoint + TCP↔stream 桥接（手机/服务器双端同构）。设计 docs/active/quic隧道.md"

[dependencies]
quinn = "0.11"
# ring 唯一后端（与主仓同宗）：rustls 默认件带 aws-lc-rs——巨型 C 源
# 树拖累 vendor/手机编，且与 ring 并存要装默认 provider，全是负资产
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }

[dev-dependencies]

# M2 迁移考题载体（scripts/test-quic-migration.sh 驱动）
[[example]]
name = "quic_echo"
