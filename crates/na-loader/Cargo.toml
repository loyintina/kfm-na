[package]
name = "na-loader"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib = APK 里被框架加载的壳; rlib 供 host 考题
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# ANativeActivity 原始结构体(只要 internal_data_path 字段)
ndk-sys = "0.6"
# JNI 原始类型(JNIEnv/jclass/jstring)——IME 符号转发层的签名用,
# 纯 FFI 类型定义,无运行时
jni-sys = "0.3"
