[workspace]
# 根包 kfm-na 是隐式成员；cordis-na = 通用运行时（基座搬家，2026-08-17 阶段 1）
members = ["crates/cordis-na"]

[package]
name = "kfm-na"
version = "0.1.0"
edition = "2024"

[lib]
# rlib 供 cargo test，cdylib 供 scripts/package-apk.sh 打包
# （NativeActivity 按 manifest meta-data android.app.lib_name 加载 libkfm_na.so）
crate-type = ["rlib", "cdylib"]

[dependencies]
# 插件基座 = cordis-na 通用运行时（src/base/ 已搬入；harness 经 `pub use
# cordis_na as base`  re-export，消费侧路径不变）
cordis-na = { path = "crates/cordis-na" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# ws 连接层（conn.rs）：host 侧 live 测试与 Android 同用一份
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
# 终端底座（termview.rs）：转义序列/网格/滚屏——最硬的骨头用现成的
alacritty_terminal = "0.25"
# 字体光栅化（termview.rs）：纯 CPU，与软渲染路线同宗
fontdue = "0.9"
# 本地 PTY（local_pty.rs，L1）：bionic 无 openpty——nix 走 posix_openpt
# 路径，Android/host Linux 同一份；fork/waitpid/kill 也在 nix
nix = { version = "0.30", features = ["term", "process", "signal"] }
# winsize/控制终端 ioctl（TIOCSWINSZ/TIOCSCTTY）直调，nix 不包这两个常量
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# native-activity 后端：免 GameActivity 的 gradle AAR 链，cargo-apk 直出
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
# 软渲染路线（2026-08-13 定案）：GPU 驱动栈双后端随机原生暴毙，终端负载
# 本就是 CPU 场景。softbuffer 与 winit 同门（rwh_06），CPU 位图直推原生窗
softbuffer = "0.4"
android_logger = "0.15"
# JNI 直取真实软键盘高度（insets.rs，BAR-006）——与 android-activity 0.6 同版本线
jni = "0.22"

# 打包配置的唯一事实源已迁至 android/AndroidManifest.xml +
# scripts/package-apk.sh（2026-08-13 脱离 cargo-apk：中文输入的 Java 皮
# 它塞不进去）。原 [package.metadata.android] 各表随之删除——留着只会
# 长成「改了不生效」的双事实源。包名 dev.kfm.na、全屏主题、configChanges
# 全集（MIUI/OriginOS relaunch 坑，见 manifest 注释）、INTERNET 权限都在
# manifest 里；签名（debug keystore）与 versionCode 在 package-apk.sh 里。

# APK 包体基线（尖刺验收 1：<10MB）——debug 包 119MB 无意义，release 必须收紧
[profile.release]
lto = true
strip = true
opt-level = 2

# 尖刺期：release 也签 Android 官方 debug keystore（口令公开，配置在
# scripts/package-apk.sh）；正式发布前必须换正式 keystore 并走密钥管理
