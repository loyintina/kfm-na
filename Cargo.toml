[package]
name = "kfm-na"
version = "0.1.0"
edition = "2024"

[lib]
# rlib 供 cargo test，cdylib 供 cargo-apk 打包（NativeActivity 加载 libkfm_na.so）
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# native-activity 后端：免 GameActivity 的 gradle AAR 链，cargo-apk 直出
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
# 软渲染路线（2026-08-13 定案）：GPU 驱动栈双后端随机原生暴毙，终端负载
# 本就是 CPU 场景。softbuffer 与 winit 同门（rwh_06），CPU 位图直推原生窗
softbuffer = "0.4"
android_logger = "0.15"

[package.metadata.android]
package = "dev.kfm.na"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
# 工具链装的 platforms;android-35（API 34 包已从官方/镜像下架，立项.md 有记）
target_sdk_version = 35

[package.metadata.android.application]
label = "KFM-NA"

# 国产 ROM 实锤坑（android-activity#196，MIUI 死锁）：cargo-apk 默认
# config_changes 只有 orientation|keyboardHidden|screenSize，OriginOS 启动时
# 注入 density/fontScale/uiMode 变化会触发 Activity relaunch——surface 在用
# 着的时候被销毁，原生层崩、无 Rust panic（2026-08-13 实拍「黑屏再退」即此）。
# 补全到 android-activity 官方示例 na-mainloop 同款全集。
[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"

# 飞鸽传书回传通道需要联网（report.rs）
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# APK 包体基线（尖刺验收 1：<10MB）——debug 包 119MB 无意义，release 必须收紧
[profile.release]
lto = true
strip = true
opt-level = 2

# 尖刺期：release 也签 debug keystore（Android 官方调试证书，口令公开）；
# 正式发布前必须换正式 keystore——届时本条删除并走密钥管理
[package.metadata.android.signing.release]
path = "/root/.android/debug.keystore"
keystore_password = "android"
